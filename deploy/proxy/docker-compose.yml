# ==========================================================================
# Reverse proxy: RU server -> Vercel
#
# Allows users in Russia to access the Vercel-hosted project
# through a proxy server on a Russian host.
#
# Flow: User -> Traefik (TLS, PROXY_DOMAIN) -> nginx -> Vercel (TARGET_DOMAIN)
#
# Environment variables (set in Portainer or .env):
#   TARGET_DOMAIN  - Vercel project domain (e.g. my-app.vercel.app)
#   PROXY_DOMAIN   - Domain pointing to this server (e.g. app.example.ru)
#
# Deployment: paste this file into Portainer Stack and hit Deploy.
# No filesystem access needed — full nginx.conf is generated inline.
#
# NOTE: $$ in the command section is docker-compose escaping.
#       Compose replaces $$ with a single $ before passing to the container.
# ==========================================================================

version: "3.7"

services:
  tg-waitlist-proxy:
    image: nginx:alpine
    environment:
      - TARGET_DOMAIN=${TARGET_DOMAIN}
      - PROXY_DOMAIN=${PROXY_DOMAIN}
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    command:
      - /bin/sh
      - -c
      - |
        cat << 'NGINXCONF' > /tmp/nginx.conf.template
        worker_processes auto;
        worker_rlimit_nofile 65535;

        events {
            worker_connections 4096;
            multi_accept on;
            use epoll;
        }

        http {
            include /etc/nginx/mime.types;
            default_type application/octet-stream;

            keepalive_timeout 65;
            keepalive_requests 1000;
            sendfile on;
            tcp_nopush on;
            tcp_nodelay on;

            gzip on;
            gzip_types application/json text/plain text/css application/javascript;

            limit_req_zone $$binary_remote_addr zone=api_submit:10m rate=10r/m;

            server {
                listen 80;
                server_name _;

                location = /api/submit-email {
                    limit_req zone=api_submit burst=5 nodelay;
                    limit_req_status 429;

                    resolver 8.8.8.8 1.1.1.0 valid=300s ipv6=off;
                    resolver_timeout 5s;

                    set $$upstream https://$${TARGET_DOMAIN};
                    proxy_pass $$upstream$$request_uri;

                    proxy_set_header Host $${TARGET_DOMAIN};
                    proxy_set_header X-Real-IP $$remote_addr;
                    proxy_set_header X-Forwarded-For $$remote_addr;
                    proxy_set_header X-Forwarded-Proto https;
                    proxy_set_header X-Forwarded-Host "";
                    proxy_set_header X-Original-URL "";
                    proxy_set_header X-Rewrite-URL "";
                    proxy_set_header Connection "";

                    proxy_ssl_server_name on;
                    proxy_ssl_protocols TLSv1.2 TLSv1.3;
                    proxy_http_version 1.1;

                    proxy_redirect https://$${TARGET_DOMAIN}/ https://$${PROXY_DOMAIN}/;

                    proxy_next_upstream error timeout http_502;
                    proxy_next_upstream_tries 2;

                    proxy_buffer_size 16k;
                    proxy_buffers 4 32k;
                }

                location / {
                    resolver 8.8.8.8 1.1.1.0 valid=300s ipv6=off;
                    resolver_timeout 5s;

                    set $$upstream https://$${TARGET_DOMAIN};
                    proxy_pass $$upstream$$request_uri;

                    proxy_set_header Host $${TARGET_DOMAIN};
                    proxy_set_header X-Real-IP $$remote_addr;
                    proxy_set_header X-Forwarded-For $$remote_addr;
                    proxy_set_header X-Forwarded-Proto https;
                    proxy_set_header X-Forwarded-Host "";
                    proxy_set_header X-Original-URL "";
                    proxy_set_header X-Rewrite-URL "";
                    proxy_set_header Connection "";

                    proxy_ssl_server_name on;
                    proxy_ssl_protocols TLSv1.2 TLSv1.3;
                    proxy_http_version 1.1;

                    proxy_redirect https://$${TARGET_DOMAIN}/ https://$${PROXY_DOMAIN}/;

                    proxy_next_upstream error timeout http_502;
                    proxy_next_upstream_tries 2;

                    proxy_buffer_size 16k;
                    proxy_buffers 4 32k;
                }
            }
        }
        NGINXCONF
        envsubst '$${TARGET_DOMAIN} $${PROXY_DOMAIN}' < /tmp/nginx.conf.template > /etc/nginx/nginx.conf
        exec nginx -g 'daemon off;'
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tg-waitlist-proxy.rule=Host(`${PROXY_DOMAIN}`)"
      - "traefik.http.routers.tg-waitlist-proxy.entrypoints=websecure"
      - "traefik.http.routers.tg-waitlist-proxy.tls.certresolver=myresolver"
      - "traefik.http.services.tg-waitlist-proxy.loadbalancer.server.port=80"
    networks:
      - web
    restart: unless-stopped

networks:
  web:
    external: true
    name: web
